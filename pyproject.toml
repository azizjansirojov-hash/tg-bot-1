[project]
name = "tg-bot-1"
version = "1.0.0"
requires-python = ">=3.11"
description = "Telegram movie-code bot"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["bot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
packages = ["bot"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
